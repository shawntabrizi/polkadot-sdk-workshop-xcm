[workspace]
resolver = "2"
members = [
  "fundamentals",
  "execution",
  "emulator",
  "parachain",
]

# Single source of truth for the polkadot-sdk pin. Bump `POLKADOT_SDK_REV` in one place
# and every member crate moves with it.
[workspace.dependencies]
# Non-SDK utilities
codec = { package = "parity-scale-codec", version = "3.7.4", default-features = false, features = ["derive"] }
scale-info = { version = "2.11.6", default-features = false, features = ["derive"] }
log = { version = "0.4.25", default-features = false }
docify = "0.2.9"
hex-literal = "0.4.1"
smallvec = "1.13.2"
deranged = { version = "=0.4.0", default-features = false }
env_logger = "0.10.0"
test-log = "0.2.12"

# polkadot-sdk — all pinned to the same git rev
